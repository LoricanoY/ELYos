name: Bug Report
description: Report an issue or unexpected behavior in ELYos tooling, infrastructure, or specifications
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with ELYos! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: input
    id: environment
    attributes:
      label: Environment & Host OS
      description: What operating system, hardware, and toolchain versions are you running?
      placeholder: e.g., Windows 11 23H2, WSL2 Ubuntu 24.04, Python 3.12, QEMU 8.2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run 'python tools/validate_manifests.py'
        2. Inspect output...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Diagnostics
      description: Paste any relevant terminal output, error tracebacks, or log excerpts.
      render: shell
