name: Community System Module Submission
description: Propose or register a new community-developed ELYos System Module
title: "[Community System Module]: "
labels: ["community-system-module", "registry"]
body:
  - type: markdown
    attributes:
      value: |
        Use this issue to announce, discuss, or request review for a **community ELYos System Module** (`.elyossysmod`).
        
        *Note:* Community source code must remain in your own external repository. Only TOML manifests are submitted to `community-system-modules/`.
  - type: input
    id: module-id
    attributes:
      label: Module Identifier
      description: Reverse-domain unique identifier.
      placeholder: e.g., org.example.custom-linux
    validations:
      required: true
  - type: input
    id: module-name
    attributes:
      label: Module Display Name
      placeholder: e.g., Custom Linux Gaming Edition
    validations:
      required: true
  - type: input
    id: repo-url
    attributes:
      label: External Repository URL
      placeholder: https://github.com/developer/custom-linux
    validations:
      required: true
  - type: input
    id: release-tag
    attributes:
      label: Release Tag / Commit Hash
      description: Immutable release reference (branches such as 'main' are not accepted).
      placeholder: e.g., v1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Overview & Purpose
      description: Describe the base operating system, features, and intended workload.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Registry Compliance Checklist
      options:
        - label: My source code is hosted externally and not committed to the ELYos repo.
          required: true
        - label: I have run 'python tools/validate_manifests.py' locally and it passes with 0 errors.
          required: true
        - label: The manifest specifies 'unverified' status (maintainers assign verified tiers).
          required: true
        - label: The manifest references an immutable Git tag or commit hash.
          required: true
