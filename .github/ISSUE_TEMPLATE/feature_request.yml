name: Feature Request
description: Propose an idea, architectural improvement, or tooling enhancement for ELYos
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals that align with the [ELYos Manifesto](docs/MANIFESTO.md) and [Technical Specification](docs/TECHNICAL_SPECIFICATION.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature proposal related to a problem or limitation? Please describe clearly.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you considered.
  - type: checkboxes
    id: architectural-check
    attributes:
      label: Architectural Compliance
      description: Please verify compliance with ELYos core principles.
      options:
        - label: This proposal respects the single-active system module principle (no concurrent OS execution).
          required: true
        - label: This proposal does not compromise Core immutability or security boundaries.
          required: true
